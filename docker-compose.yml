# PostgreSQL pour le développement : docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sigrh
      POSTGRES_PASSWORD: sigrh
      POSTGRES_DB: sigrh
    ports: ["${SIGRH_DB_PORT:-5432}:5432"]  # port hôte modifiable si 5432 est déjà pris
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
